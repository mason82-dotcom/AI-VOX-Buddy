# Voice commands for the AI-VOX3 satellite, answered by rhasspy/intent_handler.py.
# Re-run rhasspy/install.sh after changes (installs and retrains).
# Numbers use the plain-word slot list $zahl (rhasspy/gen-slots.py), not ranges
# like (1..60): Rhasspy's Vosk training would put digits instead of number
# words into the vocabulary. intent_handler.py converts the words.
# A sentence starting with an optional word needs a backslash ("\[mach] lauter"),
# otherwise the INI parser reads it as a new [Intent] section.

[GetTime]
wie spät ist es [gerade]
wie viel uhr ist es [gerade]
sag mir die uhrzeit
wie spät haben wir

[GetDate]
welcher tag ist heute
welcher wochentag ist heute
welches datum haben wir [heute]
der wievielte ist heute

[DaysUntil]
event = (weihnachten | silvester | neujahr){event}
wie viele tage [noch] bis <event>
wie lange [noch] bis <event>
wie lange dauert es [noch] bis <event>

[SetTimer]
amount = ($zahl | eine | einen){amount}
unit = (minute | minuten | sekunde | sekunden){unit}
stell [einen] timer (auf | für) <amount> <unit>
\[einen] timer (auf | für | von) <amount> <unit>
weck mich in <amount> <unit>

[TimerStatus]
wie lange läuft der timer [noch]
wie viel zeit hat der timer noch

[CancelTimer]
\[den] timer (abbrechen | stoppen | löschen)
brich den timer ab
stopp den timer

[SetVolume]
\[stell] [die] lautstärke auf ($zahl){volume} [prozent]

[VolumeUp]
\[mach] lauter
\[bitte] lauter

[VolumeDown]
\[mach] leiser
\[bitte] leiser

[Calculate]
op = (plus | minus | mal | geteilt durch | dividiert durch){op}
(was ist | wie viel ist | rechne) ($zahl){a} <op> ($zahl){b}

[Greeting]
hallo
servus
guten (morgen | tag | abend)

[Thanks]
danke [schön]
vielen dank

[Help]
was kannst du [alles]
hilfe

[Identity]
wer bist du
wie heißt du

[Repeat]
wiederhole das
was hast du gesagt
